<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTI CEA MAI BRAVO ❤️</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background-image:url('IMG_9350.jpg');

background-size:180px;

background-repeat:repeat;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

font-family:Arial,sans-serif;

}


video{

width:90%;

max-width:700px;

border-radius:15px;

box-shadow:0 0 30px rgba(255,80,160,.8);

}



#ratingScreen{

position:fixed;

inset:0;

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

color:white;


background:

radial-gradient(

circle at top,

#5f1b75,

#08030d 75%

);


z-index:100;

opacity:0;

transition:opacity 1s ease;

}



#ratingScreen.show{

display:flex;

opacity:1;

}



#ratingTitle{

margin:0 0 20px;

color:#ff9acc;

font-size:clamp(30px,8vw,60px);


text-shadow:

0 0 15px #ff3e96,

0 0 30px #ff3e96;

}



#rating{

font-size:clamp(60px,20vw,150px);

font-weight:bold;

color:#ff4e9d;


text-shadow:

0 0 20px #ff3e96,

0 0 50px #ff3e96;


transition:transform .5s,color .5s;

}



#message{

min-height:35px;

margin-top:20px;

font-size:clamp(18px,5vw,30px);

color:#ffd0e7;

}



.answerButton{

margin:5px;

padding:12px 18px;

border:none;

border-radius:25px;

background:#ff4e9d;

color:white;

font-size:18px;

cursor:pointer;

}



.finalScore{

color:#ffcf4d !important;

transform:scale(1.15);

animation:pulse 1s infinite alternate;

}



@keyframes pulse{

from{

transform:scale(1);

}


to{

transform:scale(1.2);

}

}

</style>

</head>



<body>


<video id="finalVideo" controls playsinline>

<source src="Forest.mp4" type="video/mp4">

</video>


<audio id="yaySound" src="YAY.mp3"></audio>



<div id="ratingScreen">


<h1 id="ratingTitle">

NOTA FINALĂ 😭

</h1>



<div id="rating">

0/10

</div>



<div id="message">

</div>


</div>
<script>


const video =
document.getElementById("finalVideo");


const ratingScreen =
document.getElementById("ratingScreen");


const rating =
document.getElementById("rating");


const message =
document.getElementById("message");


const yaySound =
document.getElementById("yaySound");





video.addEventListener(

"ended",

function(){


ratingScreen.style.display="flex";



requestAnimationFrame(()=>{

ratingScreen.classList.add("show");

});





setTimeout(()=>{


message.innerHTML=

"STAI OLEACAAA 🤔";


},2000);







setTimeout(()=>{


message.innerHTML=

"Recalculăm nota... ⏳";


},4000);







setTimeout(()=>{


rating.innerHTML=

"∞/10 ❤️";



rating.classList.add("finalScore");


// PLAY YAY SOUND

yaySound.currentTime = 0;

yaySound.play();




message.innerHTML=

`

ZAYA, ASTA E NOTA FRUMUSEȚII TALE ❤️


<br><br>


Îmi dai un mesaj sau iti dau eu?


<br><br>



<button class="answerButton" onclick="answer('NU ITI DAU 😭')">

IMI DAI TU

</button>


<button class="answerButton" onclick="answer('SI AI AHUIT 😂')">

SI AI AHUIT?

</button>


<button class="answerButton" onclick="window.location.href='https://t.me/StefLovesMilana'">

ITI DAU EU ❤️

</button>


`;



},6000);



}

);








function answer(choice){



fetch("https://milana06.gujastefan40.workers.dev/", {

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

answer:choice

})

});





if(choice==="NU ITI DAU 😭"){


message.innerHTML=

`

SI AI AHUIT?

<br>

(iti dau eu) 😂

`;

}



if(choice==="SI AI AHUIT "){


message.innerHTML=

`

ponel

<br>

(DA AM AHUIT)

`;

}



}



</script>



</body>

</html>
