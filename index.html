<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTI CEA MAI BRAVO ❤️</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background-image:url('IMG_9350.jpg');

background-size:180px;

background-repeat:repeat;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

font-family:Arial,sans-serif;

}


video{

width:90%;

max-width:700px;

border-radius:15px;

box-shadow:0 0 30px rgba(255,80,160,.8);

}


#ratingScreen{

position:fixed;

inset:0;

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

color:white;

background:

radial-gradient(

circle at top,

#5f1b75,

#08030d 75%

);

z-index:100;

opacity:0;

transition:opacity 1s ease;

}


#ratingScreen.show{

display:flex;

opacity:1;

}


#ratingTitle{

margin:0 0 20px;

color:#ff9acc;

font-size:clamp(30px,8vw,60px);

text-shadow:

0 0 15px #ff3e96,

0 0 30px #ff3e96;

}


#rating{

font-size:clamp(60px,20vw,150px);

font-weight:bold;

color:#ff4e9d;

text-shadow:

0 0 20px #ff3e96,

0 0 50px #ff3e96;

transition:transform .5s,color .5s;

}


#message{

min-height:35px;

margin-top:20px;

font-size:clamp(18px,5vw,30px);

color:#ffd0e7;

}


.answerButton{

display:inline-block;

margin:5px;

padding:12px 18px;

border:none;

border-radius:25px;

background:#ff4e9d;

color:white;

font-size:18px;

cursor:pointer;

text-decoration:none;

}


.telegramButton{

display:inline-block;

text-decoration:none;

}


.finalScore{

color:#ffcf4d !important;

transform:scale(1.15);

animation:pulse 1s infinite alternate;

}


@keyframes pulse{

from{

transform:scale(1);

}


to{

transform:scale(1.2);

}

}


/* WRONG ANSWER EFFECT */


.errorPopup{

position:fixed;

background:#ff3030;

color:white;

font-size:28px;

font-weight:bold;

padding:15px 25px;

border-radius:15px;

box-shadow:0 0 25px red;

z-index:999;

animation:errorGlitch .7s;

}


@keyframes errorGlitch{

0%{

transform:scale(0) rotate(-15deg);

opacity:0;

}


25%{

transform:scale(1.3) rotate(10deg);

}


50%{

transform:translateX(-15px);

}


75%{

transform:translateX(15px);

}


100%{

transform:scale(1) rotate(0);

opacity:1;

}

}

</style>

</head>

<body>

<video id="finalVideo" controls playsinline>

<source src="Forest.mp4" type="video/mp4">

</video>

<audio id="yaySound" src="YAY.mp3"></audio>

<div id="ratingScreen">

<h1 id="ratingTitle">

NOTA FINALĂ 😭

</h1>

<div id="rating">

0/10

</div>

<div id="message">

</div>

</div>

<script>


const video =
document.getElementById("finalVideo");


const ratingScreen =
document.getElementById("ratingScreen");


const rating =
document.getElementById("rating");


const message =
document.getElementById("message");


const yaySound =
document.getElementById("yaySound");



/* UNLOCK AUDIO ON PHONE */


video.addEventListener("play", ()=>{

yaySound.play().then(()=>{

yaySound.pause();

yaySound.currentTime=0;

}).catch(()=>{});

});



video.addEventListener(

"ended",

function(){


ratingScreen.style.display="flex";


requestAnimationFrame(()=>{

ratingScreen.classList.add("show");

});



setTimeout(()=>{

message.innerHTML=

"STAI OLEACAAA 🤔";

},2000);



setTimeout(()=>{

message.innerHTML=

"Recalculăm nota... ⏳";

},4000);



setTimeout(()=>{


rating.innerHTML=

"∞/10 ❤️";


rating.classList.add("finalScore");



yaySound.currentTime=0;


yaySound.play().catch(()=>{});



message.innerHTML=

`

ZAYA, ASTA E NOTA FRUMUSEȚII TALE ❤️


<br><br>


Îmi dai un mesaj cu impresia? :3


<br><br>


<button class="answerButton" onclick="wrongAnswer1()">

IMI DAI TU

</button>


<button class="answerButton" onclick="answer('SI AI AHUIT?')">

SI AI AHUIT?

</button>


<a

class="answerButton telegramButton"

href="https://t.me/StefLovesMilana"

target="_blank"

rel="noopener"

>

ITI DAU EU ❤️

</a>


`;


},6000);


}

);



function wrongAnswer1(){


fetch(

"https://milana06.gujastefan40.workers.dev/",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

answer:"IMI DAI TU"

})

}

);



let error=

document.createElement("div");


error.className=

"errorPopup";


error.innerHTML=

"EI IACA NA";


error.style.left=

Math.random()*70+"vw";


error.style.top=

Math.random()*70+"vh";


document.body.appendChild(error);


setTimeout(()=>{

error.remove();

},1500);


}



function answer(choice){


fetch(

"https://milana06.gujastefan40.workers.dev/",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

answer:choice

})

}

);



let error=

document.createElement("div");


error.className=

"errorPopup";


error.innerHTML=

"DA AM AHUIT";


error.style.left=

Math.random()*70+"vw";


error.style.top=

Math.random()*70+"vh";


document.body.appendChild(error);


setTimeout(()=>{

error.remove();

},1500);


}


</script>

</body>

</html>
